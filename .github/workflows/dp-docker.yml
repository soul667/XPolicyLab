name: Build DP Docker image

on:
  pull_request:
    paths:
      - ".github/workflows/dp-docker.yml"
      - "policy/DP/**"
      - "client_server/**"
      - "utils/**"
      - "pyproject.toml"
      - "XPolicyLab.py"
      - "model_template.py"
      - "setup_policy_server.py"
  push:
    branches:
      - main
    tags:
      - "dp-v*"
    paths:
      - ".github/workflows/dp-docker.yml"
      - "policy/DP/**"
      - "client_server/**"
      - "utils/**"
      - "pyproject.toml"
      - "XPolicyLab.py"
      - "model_template.py"
      - "setup_policy_server.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dp-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xpolicylab-dp

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: policy/DP/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dp
          cache-to: type=gha,mode=max,scope=dp

